name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # CPU torch: tests/test_v2_rl.py exercises the v2 trainer. Editable install: the v2 tests resolve docs/results/ relative to the repo root.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,rl]'
      # Fast subset: skips the multi-episode closed-loop tests marked `slow`.
      - run: python -m pytest -p no:cacheprovider -q -m 'not slow'
      # Smoke run of the uncertainty benchmark on the tuning split (not evidence).
      - run: python -m navlab benchmark-uncertainty --quick --workers 2 --output ci-quick
      - run: test -s ci-quick/summary_quick.csv && test -s ci-quick/README_quick.md
  rl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,rl]'
      # Includes the frozen-weights, freeze-verification and PPO trainer tests that need torch.
      - run: python -m pytest -p no:cacheprovider -q tests/test_rl.py tests/test_learning.py
