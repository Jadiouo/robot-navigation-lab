# Reference values in SI units (m, s, rad). The current CLI exposes its
# effective values as flags and records them in run.json; it does not load TOML.
[vehicle]
wheelbase = 2.5
width = 1.6
front_overhang = 0.8
rear_overhang = 0.8
dt = 0.05
max_steer = 0.6
max_steer_rate = 0.8
max_accel = 2.0
max_decel = 3.0
max_speed = 8.0
safety_margin = 0.15

[evaluation]
seed = 0
planner_budget = 2000
max_steps = 2000
success_position_tolerance_m = 1.25
success_speed_tolerance_mps = 0.45
