[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-navigation-lab"
version = "0.1.0"
description = "Navigation under uncertainty: a frozen, paired stress benchmark of LiDAR+MCL navigation stacks (pure pursuit, DWA, MPPI, PPO) on procedurally generated maps."
readme = "README.md"
keywords = ["robotics", "navigation", "localization", "monte-carlo-localization", "lidar", "dwa", "mppi", "ppo", "benchmark", "simulation"]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "Pillow>=10",
  "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
rl = ["torch>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
navlab = "navlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"navlab.rl" = ["weights/*.npz"]
"navlab.v2" = ["weights/*.npz", "weights_nv/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: multi-episode closed-loop tests (seconds each); deselect with -m 'not slow'"]
